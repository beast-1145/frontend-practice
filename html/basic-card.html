<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>basic profile card</title>
    <link rel="stylesheet" href="css/profile-card.css">
</head>
<body>
<div class="card-container">
    <div class="profile-pic">
        <img class="profile-img" src="../images/profile-avatar.png" alt="profile-pic">
    </div>
    <div class="profile-content">
        <h3 class="txt-content">John Doe</h3>
        <p class="txt-content">Designation: SDE-2</p>
        <p class="txt-content">Contact:johndoe@gmail.com</p>
        <div class="txt-content">
            <button class="follow-btn">LinkedIn</button>
        </div>
    </div>
</div>
</body>
</html>
